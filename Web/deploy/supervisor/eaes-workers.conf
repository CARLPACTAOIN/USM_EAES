[program:eaes-attendance-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/eaes/artisan queue:work redis --queue=attendance --sleep=1 --timeout=120 --tries=3 --max-time=3600
directory=/var/www/eaes
autostart=true
autorestart=true
startretries=10
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/eaes-attendance-worker.log
stopwaitsecs=330

[program:eaes-default-worker]
command=/usr/bin/php /var/www/eaes/artisan queue:work redis --queue=default --sleep=1 --timeout=180 --tries=3 --max-time=3600
directory=/var/www/eaes
autostart=true
autorestart=true
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/eaes-default-worker.log
stopwaitsecs=330

[program:eaes-ai-worker]
command=/usr/bin/php /var/www/eaes/artisan queue:work redis --queue=ai --sleep=1 --timeout=180 --tries=3 --max-time=3600
directory=/var/www/eaes
autostart=true
autorestart=true
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/eaes-ai-worker.log
stopwaitsecs=330

[program:eaes-scheduler]
command=/usr/bin/php /var/www/eaes/artisan schedule:work
directory=/var/www/eaes
autostart=true
autorestart=true
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/eaes-scheduler.log
stopwaitsecs=30
