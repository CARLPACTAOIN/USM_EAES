[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eaes-dev-orchestrator"
version = "0.1.0"
description = "LangGraph-based development orchestrator for the USM EAES repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
dev-agent = "dev_orchestrator.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_orchestrator"]
